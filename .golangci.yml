version: "2"

run:
  tests: false

linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - cyclop
    - dogsled
    - dupl
    - errcheck
    - errorlint
    - funlen
    - ginkgolinter
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godox
    - goprintffuncname
    - gosec
    - ineffassign
    - lll
    - makezero
    - misspell
    - mnd
    - nakedret
    - nestif
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
    - unused
    - varnamelen
    - whitespace

  settings:
    cyclop:
      max-complexity: 10
    errorlint:
      comparison: true
    goconst:
      ignore-string-values: .*?%s|%v|%w.*
      numbers: true
      ignore-calls: false
    gocritic:
      enable-all: true
    gocyclo:
      min-complexity: 10
    lll:
      line-length: 99
    nestif:
      min-complexity: 3
    prealloc:
      simple: false
      for-loops: true
    whitespace:
      multi-func: true

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters: # more readable
          - varnamelen
        path: internal/pkg/display/ssd1306/image\.go
        text: "parameter name '[xy]' is too short for the scope of its usage"
      - linters:
          - varnamelen
        text: variable name 'wg' is too short for the scope of its usage
      - linters: # relative value of text line height
          - mnd
        path: internal/app/entity/sensordata\.go
        text: "Magic number: [42], in (<argument>|<assign>) detected"
      - linters:
          - lll
        path: config/config\.go
      - linters: # different screen sctucts are more understandable
          - dupl
        path: internal/app/service/screen/sens_.*?\.go
        text: "1-78 lines are duplicate of `internal/app/service/screen/sens_.*?.go:1-78`"
    paths:
      - bin

issues:
  fix: false

formatters:
  enable:
    - gofmt
    - goimports
